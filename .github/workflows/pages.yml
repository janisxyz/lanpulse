name: GitHub Pages

# Canonical policy is live at https://janisxyz.github.io/lanpulse/
# (janisxyz/janisxyz.github.io). Project Pages on this repo cannot be created
# with GITHUB_TOKEN. Enable Settings → Pages → GitHub Actions to activate.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: Detect project Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "/repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Project Pages is off. Canonical policy: https://janisxyz.github.io/lanpulse/"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
